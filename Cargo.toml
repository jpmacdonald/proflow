[package]
name = "proflow"
version = "0.1.0"
edition = "2021"
build = "build.rs"
autobins = false
description = "Planning Center to ProPresenter worship service workflow tool"
license = "MIT"
repository = "https://github.com/jimmy/proflow"
keywords = ["propresenter", "planning-center", "worship"]
categories = ["command-line-utilities"]

[[bin]]
name = "proflow_mcp"
path = "src/bin/proflow_mcp.rs"

[[bin]]
name = "build_service"
path = "src/bin/build_service.rs"

[[bin]]
name = "dump_macros"
path = "src/bin/dump_macros.rs"
required-features = ["dev-tools"]

[[bin]]
name = "dump_plans"
path = "src/bin/dump_plans.rs"
required-features = ["dev-tools"]

[[bin]]
name = "dump_playlist_doc"
path = "src/bin/dump_playlist_doc.rs"
required-features = ["dev-tools"]

[[bin]]
name = "dump_pro"
path = "src/bin/dump_pro.rs"
required-features = ["dev-tools"]

[[bin]]
name = "dump_theme"
path = "src/bin/dump_theme.rs"
required-features = ["dev-tools"]

[[bin]]
name = "materialize_real_playlist"
path = "src/bin/materialize_real_playlist.rs"
required-features = ["dev-tools"]

[[bin]]
name = "parity_diff"
path = "src/bin/parity_diff.rs"
required-features = ["dev-tools"]

[[bin]]
name = "parity_smoke"
path = "src/bin/parity_smoke.rs"
required-features = ["dev-tools"]

[[bin]]
name = "release_audit"
path = "src/bin/release_audit.rs"
required-features = ["dev-tools"]

[dependencies]
# ProPresenter integration
prost = "0.12"
uuid = { version = "1.7", features = ["v4"] }
regex = "1.9.0"

# Planning Center integration
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
futures = "0.3"

# Async
tokio = { version = "1.36.0", features = ["full"] }

# Serialization
serde = { version = "1.0.197", features = ["derive"] }
serde_json = "1.0.114"

# Date & time
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = "2"
anyhow = "1.0.80"

# Logging
tracing = "0.1.37"
dotenv = { package = "dotenvy", version = "0.15.7" }

# Common utilities
fuzzy-matcher = "0.3"
walkdir = "2.4"
unicode-width = "0.1.11"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
crc32fast = "1.5"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "tiff"] }

# Additional dependencies
dirs = "6"
rayon = "1.10.0"
sha2 = "0.10"

# MCP server
rmcp = { version = "=1.4.0", features = ["server", "transport-io"] }
schemars = "1"

[dev-dependencies]
tempfile = "3.10"
httptest = "0.16.4"
proptest = "1.7"

[features]
default = []
dev-tools = []
integration_test = []

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
# Specific denials
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
clone_on_ref_ptr = "deny"
# Relaxations for this codebase
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
multiple_crate_versions = "allow"
