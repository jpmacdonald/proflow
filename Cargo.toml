[workspace]
members = ["crates/propresenter", "tools/proto-gen", "tools/schema-audit"]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/jpmacdonald/proflow"

# Versions shared by every workspace member live here so the format crate and
# the host crate cannot drift apart.
[workspace.dependencies]
proflow-propresenter = { path = "crates/propresenter" }
anyhow = "1.0.80"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "tiff"] }
proptest = "1.7"
prost = "0.12"
schemars = "1"
serde = { version = "1.0.197", features = ["derive"] }
serde_json = "1.0.114"
sha2 = "0.10"
tempfile = "3.10"
thiserror = "2"
toml = "1"
tracing = "0.1.37"
uuid = { version = "1.7", features = ["v4", "serde"] }
walkdir = "2.4"
zip = { version = "0.6", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
# Specific denials
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
clone_on_ref_ptr = "deny"
# Relaxations for this codebase
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
multiple_crate_versions = "allow"

[package]
name = "proflow"
version = "0.1.0"
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
autobins = false
description = "Planning Center to ProPresenter worship service workflow tool"
keywords = ["propresenter", "planning-center", "worship"]
categories = ["command-line-utilities"]

[lints]
workspace = true

[[bin]]
name = "proflow_mcp"
path = "src/bin/proflow_mcp.rs"

[[bin]]
name = "proflow"
path = "src/bin/proflow.rs"

[[bin]]
name = "dump_macros"
path = "src/bin/dump_macros.rs"
required-features = ["dev-tools"]

[[bin]]
name = "dump_plans"
path = "src/bin/dump_plans.rs"
required-features = ["dev-tools"]

[[bin]]
name = "dump_playlist_doc"
path = "src/bin/dump_playlist_doc.rs"
required-features = ["dev-tools"]

[[bin]]
name = "dump_pro"
path = "src/bin/dump_pro.rs"
required-features = ["dev-tools"]

[[bin]]
name = "dump_theme"
path = "src/bin/dump_theme.rs"
required-features = ["dev-tools"]

[[bin]]
name = "materialize_real_playlist"
path = "src/bin/materialize_real_playlist.rs"
required-features = ["dev-tools"]

[[bin]]
name = "parity_diff"
path = "src/bin/parity_diff.rs"
required-features = ["dev-tools"]

[[bin]]
name = "parity_smoke"
path = "src/bin/parity_smoke.rs"
required-features = ["dev-tools"]

[[bin]]
name = "release_audit"
path = "src/bin/release_audit.rs"
required-features = ["dev-tools"]

[dependencies]
proflow-propresenter.workspace = true

# Planning Center integration
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
futures = "0.3"
url = "2"
tokio = { version = "1.36.0", features = ["full"] }

# Native document handling in the workflow and diagnostic binaries
prost.workspace = true
uuid.workspace = true
image.workspace = true
walkdir.workspace = true
sha2.workspace = true

# Serialization, time, errors, logging
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
thiserror.workspace = true
toml.workspace = true
anyhow.workspace = true
tracing.workspace = true
dotenv = { package = "dotenvy", version = "0.15.7" }
dirs.workspace = true

# MCP server
rmcp = { version = "=1.4.0", features = ["server", "transport-io"] }
schemars.workspace = true

[dev-dependencies]
proflow-propresenter = { workspace = true, features = ["diagnostics"] }
tempfile.workspace = true
httptest = "0.16.4"
proptest.workspace = true

[features]
default = []
dev-tools = ["proflow-propresenter/dev-tools"]
integration_test = []
