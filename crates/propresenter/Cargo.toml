[package]
name = "proflow-propresenter"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "ProPresenter native document, playlist, package, and text-layout support"
build = "build.rs"
publish = false

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true, optional = true }
crc32fast = "1.5"
dirs.workspace = true
fuzzy-matcher = "0.3"
image.workspace = true
prost.workspace = true
rayon = "1.10.0"
regex = "1.9.0"
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true
unicode-width = "0.1.11"
uuid.workspace = true
walkdir.workspace = true
zip.workspace = true

[dev-dependencies]
anyhow.workspace = true
proptest.workspace = true
tempfile.workspace = true

[features]
default = []
# Live-library and raw-export helpers for fidelity tooling.
dev-tools = ["dep:anyhow"]
# Diagnostic constructors for dependent crates' tests. Never enabled by a
# production build.
diagnostics = []
